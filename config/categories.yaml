# 股价类（design §4 01:32 收窄版）：只看主标题。强词命中 1 个，或 市场词+动作词 同时出现 → 股价类
# share/shares 只是市场词（Q6）。→ 不进 AI/芯片榜，加 finance 桶，H 不打折。例外：含发布词且无强词 → 不算。已去掉金额正则和 trillion-dollar。
