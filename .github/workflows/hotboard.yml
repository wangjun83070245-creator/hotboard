# 实时热榜：每小时抓取 + 排序 + 发布到 GitHub Pages。不调用 AI，不使用任何 secret / 个人 PAT。
name: hotboard
on:
  schedule:
    - cron: "23,53 * * * *"  # UTC 每小时第 23、53 分
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: hotboard
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.run.outputs.skip }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir -r requirements.txt
      # 上一轮快照（升降/NEW/轨迹）只存 Actions cache；cache 丢失 → 按首次运行，页面照常
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/snapshots
          key: hotboard-snapshots-${{ github.run_id }}
          restore-keys: hotboard-snapshots-
      - id: run
        run: |
          set +e
          python -m hot.run
          rc=$?
          set -e
          if [ "$rc" = "3" ]; then
            echo "::warning::全部源失败：不写快照、不覆盖页面（本地告警，不对外发送）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" != "0" ]; then
            exit "$rc"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.run.outputs.skip == 'false'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/snapshots
          key: hotboard-snapshots-${{ github.run_id }}
      - if: steps.run.outputs.skip == 'false'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
          retention-days: 1
  deploy:
    needs: build
    if: needs.build.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
