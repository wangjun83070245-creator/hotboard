# Strong terms matched against full_name only. In names, hyphen, underscore, and dot are word boundaries
# (so "alt-access" matches substance-3d-alt-access; "crack" does not match crackle-app).
block_name_terms:
  - crack
  - cracked
  - keygen
  - alt-access
  - activator
# In topics only: these terms match with no companion. Hyphen, underscore, and dot in a topic
# are word boundaries, so "exitlag-patched" matches "patched".
block_topic_free_terms:
  - patched
# Description-only regexes, case-insensitive.
block_description_patterns:
  - "standalone (desktop )?setup"
  - "desktop installer"
  - "full installer"
  - "ready-to-run desktop edition"
  - "all features (pre-)?activated"
